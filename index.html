<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Request</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f4ff, #e0ffe0);
      margin: 0;
      padding: 20px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    h1, h2 {
      color: #2c3e50;
    }
    form {
      margin: 20px auto;
      max-width: 90%;
      width: 400px;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1em;
      resize: none;
      box-sizing: border-box;
    }
    button {
      padding: 12px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #219150;
    }
    .error-message {
      color: red;
      font-size: 0.9em;
    }
    #prayerList {
      margin-top: 30px;
      text-align: left;
      max-width: 90%;
      width: 600px;
      margin-left: auto;
      margin-right: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .prayer-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .prayer-item:last-child {
      border-bottom: none;
    }
    .reaction-buttons {
      margin-top: 10px;
    }
    .reaction-buttons button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
      margin-right: 10px;
    }
    .dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    .dark-mode form, .dark-mode #prayerList {
      background-color: #2c2c2c;
      color: #eee;
    }
    .dark-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #statsPanel {
      margin-top: 20px;
      padding: 10px;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      form, #prayerList {
        width: 95%;
        padding: 15px;
      }
      input, textarea {
        font-size: 0.95em;
      }
      button {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>

  <button class="dark-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <h1>Submit a Prayer Request</h1>
  <form id="prayerForm">
    <input type="text" id="name" placeholder="Your Name (optional)">
    <textarea id="request" rows="4" placeholder="Write your prayer request here..." required></textarea>
    <div id="errorMessage" class="error-message"></div>
    <button type="submit">Submit</button>
  </form>

  <div id="prayerList">
    <h2>People's Prayer List</h2>
    <div id="requestsContainer"></div>
    <div id="statsPanel"></div>
  </div>

  <script>
    const form = document.getElementById('prayerForm');
    const nameInput = document.getElementById('name');
    const requestInput = document.getElementById('request');
    const errorMessage = document.getElementById('errorMessage');
    const requestsContainer = document.getElementById('requestsContainer');
    const statsPanel = document.getElementById('statsPanel');

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    function getStoredRequests() {
      return JSON.parse(localStorage.getItem('prayerRequests') || '[]');
    }

    function storeRequests(requests) {
      localStorage.setItem('prayerRequests', JSON.stringify(requests));
    }

    function renderRequests() {
      const allRequests = getStoredRequests();
      const userSet = new Set();
      requestsContainer.innerHTML = '';

      allRequests.forEach(({ name, text, time }) => {
        userSet.add(name);
        const prayerItem = document.createElement('div');
        prayerItem.classList.add('prayer-item');
        prayerItem.innerHTML = `
          <strong>${name}</strong>:<br>
          <li>${text} <small>(${time})</small></li>
          <div class="reaction-buttons">
            <button onclick="alert('❤️ Prayed!')">❤️</button>
            <button onclick="alert('🙏 Lifted in Prayer!')">🙏</button>
          </div>`;
        requestsContainer.appendChild(prayerItem);
      });

      statsPanel.textContent = `Total Prayers: ${allRequests.length} | Unique Users: ${userSet.size}`;
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorMessage.textContent = '';

      const name = (nameInput.value.trim() || "Anonymous");
      const request = requestInput.value.trim();

      if (request === '') {
        errorMessage.textContent = 'Prayer request cannot be empty.';
        return;
      }

      const now = new Date();
      const timestamp = now.toLocaleString();

      const newEntry = { name, text: request, time: timestamp };
      const allRequests = getStoredRequests();
      allRequests.push(newEntry);
      storeRequests(allRequests);

      renderRequests();
      form.reset();
    });

    // Render on load
    renderRequests();
  </script>

</body>
</html>
