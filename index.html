<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Request</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f4ff, #e0ffe0);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1, h2 {
      color: #2c3e50;
    }
    form {
      margin: 20px auto;
      max-width: 90%;
      width: 400px;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1em;
    }
    button {
      padding: 12px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #219150;
    }
    .error-message {
      color: red;
      font-size: 0.9em;
    }
    #prayerList {
      margin-top: 30px;
      text-align: left;
      max-width: 90%;
      width: 600px;
      margin-left: auto;
      margin-right: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .prayer-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .prayer-item:last-child {
      border-bottom: none;
    }
    .edit-btn {
      background-color: #3498db;
      border: none;
      color: white;
      padding: 4px 8px;
      margin-top: 5px;
      font-size: 0.85em;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-btn:hover {
      background-color: #2980b9;
    }
    @media (max-width: 600px) {
      form, #prayerList {
        width: 95%;
        padding: 15px;
      }
      input, textarea {
        font-size: 0.95em;
      }
      button {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <h1>Submit a Prayer Request</h1>
  <form id="prayerForm">
    <input type="text" id="name" placeholder="Your Name (optional)">
    <textarea id="request" placeholder="Your Prayer Request" required></textarea>
    <div id="errorMessage" class="error-message"></div>
    <button type="submit">Submit</button>
  </form>

  <div id="prayerList">
    <h2>People's Prayer List</h2>
    <div id="requestsContainer"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAP13ca_A_u1zuwTHi-4Kfd8AyO_7gjfgI",
      authDomain: "pray-eb2b0.firebaseapp.com",
      projectId: "pray-eb2b0",
      storageBucket: "pray-eb2b0.firebasestorage.app",
      messagingSenderId: "84874820473",
      appId: "1:84874820473:web:640b90de623d6cbedfcda8"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    let currentUser = null;

    firebase.auth().signInAnonymously().then(userCredential => {
      currentUser = userCredential.user;
      loadRequests();
    });

    const form = document.getElementById('prayerForm');
    const nameInput = document.getElementById('name');
    const requestInput = document.getElementById('request');
    const errorMessage = document.getElementById('errorMessage');
    const requestsContainer = document.getElementById('requestsContainer');

    function renderRequests(snapshot) {
      requestsContainer.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;

      const grouped = {};
      Object.entries(data).forEach(([key, item]) => {
        const name = item.name || 'Anonymous';
        if (!grouped[name]) grouped[name] = [];
        grouped[name].push({ ...item, key });
      });

      Object.entries(grouped).forEach(([name, items]) => {
        const prayerItem = document.createElement('div');
        prayerItem.classList.add('prayer-item');

        const list = document.createElement('ul');
        items.forEach(({ text, uid, key, timestamp }) => {
          const listItem = document.createElement('li');
          listItem.innerHTML = `${text} <br><small>Submitted on ${new Date(timestamp).toLocaleString()}</small>`;

          if (uid === currentUser.uid) {
            const editBtn = document.createElement('button');
            editBtn.classList.add('edit-btn');
            editBtn.textContent = 'Edit';
            editBtn.onclick = () => {
              const newText = prompt('Edit your prayer item:', text);
              if (newText && newText.trim()) {
                db.ref('prayers/' + key).update({ text: newText.trim() });
              }
            };
            listItem.appendChild(editBtn);
          }

          list.appendChild(listItem);
        });

        prayerItem.innerHTML = `<strong>${name}</strong>:`;
        prayerItem.appendChild(list);
        requestsContainer.appendChild(prayerItem);
      });
    }

    function loadRequests() {
      db.ref('prayers').on('value', renderRequests);
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorMessage.textContent = '';

      const name = nameInput.value.trim() || 'Anonymous';
      const request = requestInput.value.trim();

      if (request === '') {
        errorMessage.textContent = 'Prayer request cannot be empty.';
        return;
      }

      const newEntry = {
        name: name.charAt(0).toUpperCase() + name.slice(1),
        text: request,
        uid: currentUser.uid,
        timestamp: Date.now()
      };

      db.ref('prayers').push(newEntry);
      form.reset();
    });
  </script>
</body>
</html>
