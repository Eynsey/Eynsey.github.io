<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Request</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f4ff, #e0ffe0);
      margin: 0;
      padding: 20px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    #introOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      padding: 20px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #introOverlay button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }
    #introOverlay button:hover {
      background: #1e864c;
    }
    h1, h2 {
      color: #2c3e50;
      transition: color 0.3s;
    }
    .dark-mode h1, .dark-mode h2 {
      color: #eee;
    }
    form {
      margin: 20px auto;
      max-width: 90%;
      width: 400px;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1em;
      resize: none;
      box-sizing: border-box;
      transition: border 0.3s;
    }
    input:focus, textarea:focus {
      border: 1px solid #27ae60;
      outline: none;
    }
    textarea {
      resize: none;
      height: 100px;
    }
    button {
      padding: 12px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #219150;
    }
    .error-message {
      color: red;
      font-size: 0.9em;
    }
    #prayerList {
      margin-top: 30px;
      text-align: left;
      max-width: 90%;
      width: 800px;
      margin-left: auto;
      margin-right: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .prayer-item {
      border-bottom: 1px solid #eee;
      padding: 10px;
      width: 48%;
      display: inline-block;
      vertical-align: top;
      box-sizing: border-box;
      background-color: rgba(0, 0, 0, 0.02);
      border-radius: 8px;
      margin-bottom: 10px;
      position: relative;
      animation: fadeIn 0.5s ease-in-out;
    }
    .prayer-item:nth-child(even) {
      margin-left: 4%;
      background-color: rgba(0, 0, 0, 0.05);
    }
    .reaction-buttons {
      margin-top: 10px;
    }
    .reaction-buttons button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8em;
      margin-right: 6px;
    }
    .delete-button {
      position: absolute;
      top: 5px;
      right: 10px;
      color: red;
      cursor: pointer;
      font-size: 1.2em;
      z-index: 1000;
    }
    .dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    .dark-mode form, .dark-mode #prayerList {
      background-color: #2c2c2c;
      color: #eee;
    }
    .dark-mode .counts, .dark-mode #statsPanel {
      color: #ccc;
    }
    .dark-mode #title, .dark-mode #listTitle {
      color: #eee;
    }
    .dark-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #statsPanel {
      margin-top: 10px;
      text-align: right;
      font-weight: bold;
      font-size: 10px;
      color: #666;
    }
    .counts {
      font-size: 0.85em;
      color: #666;
    }
    @media (max-width: 600px) {
      form, #prayerList {
        width: 95%;
        padding: 15px;
      }
      .prayer-item {
        width: 100%;
        margin-left: 0 !important;
      }
      .delete-button {
        font-size: 1.5em;
      }
    }
  </style>
  <script>
    const verses = [
      "Pray without ceasing. - 1 Thessalonians 5:17",
      "The prayer of a righteous person is powerful and effective. - James 5:16",
      "Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God. - Philippians 4:6",
      "And whatever you ask in prayer, you will receive, if you have faith. - Matthew 21:22",
      "Above all, love each other deeply, because love covers over a multitude of sins. - 1 Peter 4:8"
    ];
    window.onload = () => {
      const verse = verses[Math.floor(Math.random() * verses.length)];
      const overlay = document.getElementById('introOverlay');
      const verseElement = document.getElementById('verseOfTheDay');
      verseElement.innerText = verse;
    }
  </script>
</head>
<body>
  <div id="introOverlay">
    <h1>Welcome to the Prayer Request Page</h1>
    <p>Prayer connects us to God and one another. Through faith, love, and hope, we lift each other up.</p>
    <p id="verseOfTheDay"></p>
    <button onclick="document.getElementById('introOverlay').style.display='none'">Enter</button>
  </div>
</body>
</html>
