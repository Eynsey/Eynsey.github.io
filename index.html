<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Request</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f4ff, #e0ffe0);
      margin: 0;
      padding: 20px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    #introOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      padding: 20px;
      text-align: center;
    }
    #introOverlay button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
    }
    h1, h2 {
      color: #2c3e50;
      transition: color 0.3s;
      margin: 10px 0;
    }
    .dark-mode h1, .dark-mode h2 {
      color: #eee;
    }
    form {
      margin: 20px auto;
      width: 100%;
      max-width: 500px;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1em;
    }
    textarea {
      resize: none;
      height: 100px;
    }
    button {
      padding: 12px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #219150;
    }
    .error-message {
      color: red;
      font-size: 0.9em;
    }
    #prayerList {
      margin-top: 30px;
      text-align: left;
      max-width: 800px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .prayer-item {
      border-bottom: 1px solid #eee;
      padding: 10px;
      width: 100%;
      display: block;
      background-color: rgba(0, 0, 0, 0.02);
      border-radius: 8px;
      margin-bottom: 10px;
      position: relative;
    }
    .reaction-buttons {
      margin-top: 10px;
    }
    .reaction-buttons button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8em;
      margin-right: 6px;
    }
    .delete-button {
      position: absolute;
      top: 5px;
      right: 10px;
      color: red;
      cursor: pointer;
      font-size: 0.8em;
    }
    .dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    .dark-mode form, .dark-mode #prayerList {
      background-color: #2c2c2c;
      color: #eee;
    }
    .dark-mode .counts, .dark-mode #statsPanel {
      color: #ccc;
    }
    .dark-mode #title, .dark-mode #listTitle {
      color: #eee;
    }
    .dark-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10000;
    }
    #statsPanel {
      margin-top: 10px;
      text-align: right;
      font-weight: bold;
      font-size: 10px;
      color: #666;
    }
    .counts {
      font-size: 0.85em;
      color: #666;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      form, #prayerList {
        padding: 15px;
      }
      h1, h2 {
        font-size: 1.2em;
      }
      .dark-toggle {
        padding: 8px 12px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <div id="introOverlay">
    <h1>Welcome to the Prayer Wall</h1>
    <p>Prayer is a way for us to connect with God and each other. It's a moment of reflection, hope, and unity. By sharing your prayer, you invite others to stand with you in faith.</p>
    <button onclick="document.getElementById('introOverlay').style.display='none'">Continue</button>
  </div>

  <button class="dark-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <h1 id="title">Submit a Prayer Request</h1>
  <form id="prayerForm">
    <input type="text" id="name" placeholder="Your Name (optional)" maxlength="50">
    <textarea id="request" rows="4" placeholder="Write your prayer request here..." required maxlength="500"></textarea>
    <div id="errorMessage" class="error-message"></div>
    <button type="submit">Submit</button>
  </form>

  <div id="prayerList">
    <h2 style="display: flex; justify-content: space-between; align-items: center;">
      <span id="listTitle">People's Prayer List</span>
      <span id="statsPanel"></span>
    </h2>
    <div id="requestsContainer"></div>
  </div>

  <script>
    const form = document.getElementById('prayerForm');
    const nameInput = document.getElementById('name');
    const requestInput = document.getElementById('request');
    const errorMessage = document.getElementById('errorMessage');
    const requestsContainer = document.getElementById('requestsContainer');
    const statsPanel = document.getElementById('statsPanel');

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    function getStoredRequests() {
      return JSON.parse(localStorage.getItem('prayerRequests') || '[]');
    }

    function storeRequests(requests) {
      localStorage.setItem('prayerRequests', JSON.stringify(requests));
    }

    function deleteRequest(index) {
      const password = prompt("Enter admin password to delete:");
      if (password === "39619812n") {
        let allRequests = getStoredRequests();
        allRequests.splice(index, 1);
        storeRequests(allRequests);
        renderRequests();
      } else {
        alert("Incorrect password.");
      }
    }

    function renderRequests() {
      const allRequests = getStoredRequests();
      const userSet = new Set();
      let totalHearts = 0;
      let totalPrayers = 0;
      requestsContainer.innerHTML = '';

      allRequests.forEach((entry, index) => {
        const { name, text, time, heartCount = 0, prayerCount = 0 } = entry;
        userSet.add(name);
        totalHearts += heartCount;
        totalPrayers += prayerCount;

        const prayerItem = document.createElement('div');
        prayerItem.classList.add('prayer-item');
        prayerItem.innerHTML = `
          <strong>${name}</strong> <small>(${time})</small><br>
          <li>${text}</li>
          <div class="reaction-buttons">
            <button class="heart-btn">❤️</button><span class="counts"> ${heartCount}</span>
            <button class="prayer-btn">🙏</button><span class="counts"> ${prayerCount}</span>
          </div>
          <span class="delete-button" title="Delete this prayer">✖</span>
        `;

        prayerItem.querySelector('.heart-btn').addEventListener('click', () => addReaction(index, 'heart'));
        prayerItem.querySelector('.prayer-btn').addEventListener('click', () => addReaction(index, 'prayer'));
        prayerItem.querySelector('.delete-button').addEventListener('click', () => deleteRequest(index));

        requestsContainer.insertBefore(prayerItem, requestsContainer.firstChild);
      });

      statsPanel.textContent = `Total Prayers: ${allRequests.length} | Unique Users: ${userSet.size} | ❤️: ${totalHearts} | 🙏: ${totalPrayers}`;
    }

    function addReaction(index, type) {
      const allRequests = getStoredRequests();
      if (type === 'heart') allRequests[index].heartCount = (allRequests[index].heartCount || 0) + 1;
      if (type === 'prayer') allRequests[index].prayerCount = (allRequests[index].prayerCount || 0) + 1;
      storeRequests(allRequests);
      renderRequests();
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorMessage.textContent = '';

      const name = (nameInput.value.trim() || "Anonymous");
      const request = requestInput.value.trim();

      if (request === '') {
        errorMessage.textContent = 'Prayer request cannot be empty.';
        return;
      }

      const now = new Date();
      const timestamp = now.toLocaleString();

      const newEntry = { name, text: request, time: timestamp, heartCount: 0, prayerCount: 0 };
      const allRequests = getStoredRequests();
      allRequests.push(newEntry);
      storeRequests(allRequests);

      renderRequests();
      form.reset();

      alert('Prayer submitted successfully!');
    });

    window.onload = () => {
      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
      }
      renderRequests();
    };
  </script>
</body>
</html>
