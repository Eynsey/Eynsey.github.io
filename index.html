<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Request</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f4ff, #e0ffe0);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1, h2 {
      color: #2c3e50;
    }
    form {
      margin: 20px auto;
      max-width: 90%;
      width: 400px;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1em;
    }
    button {
      padding: 12px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #219150;
    }
    .error-message {
      color: red;
      font-size: 0.9em;
    }
    #prayerList {
      margin-top: 30px;
      text-align: left;
      max-width: 90%;
      width: 600px;
      margin-left: auto;
      margin-right: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .prayer-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .prayer-item:last-child {
      border-bottom: none;
    }
    .edit-btn {
      background-color: #3498db;
      border: none;
      color: white;
      padding: 4px 8px;
      margin-top: 5px;
      font-size: 0.85em;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-btn:hover {
      background-color: #2980b9;
    }
    @media (max-width: 600px) {
      form, #prayerList {
        width: 95%;
        padding: 15px;
      }
      input, textarea {
        font-size: 0.95em;
      }
      button {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>

  <h1>Submit a Prayer Request</h1>
  <form id="prayerForm">
    <input type="text" id="name" placeholder="Your Name (optional)">
    <textarea id="request" placeholder="Your Prayer Request" required></textarea>
    <div id="errorMessage" class="error-message"></div>
    <button type="submit">Submit</button>
  </form>

  <div id="prayerList">
    <h2>People's Prayer List</h2>
    <div id="requestsContainer"></div>
  </div>

  <script>
    const form = document.getElementById('prayerForm');
    const nameInput = document.getElementById('name');
    const requestInput = document.getElementById('request');
    const errorMessage = document.getElementById('errorMessage');
    const requestsContainer = document.getElementById('requestsContainer');

    let prayerMap = new Map();

    function saveToStorage() {
      const obj = Object.fromEntries(prayerMap);
      localStorage.setItem('prayers', JSON.stringify(obj));
    }

    function loadFromStorage() {
      const data = JSON.parse(localStorage.getItem('prayers')) || {};
      prayerMap = new Map(Object.entries(data));
    }

    function renderRequests() {
      requestsContainer.innerHTML = '';
      prayerMap.forEach((requests, name) => {
        const prayerItem = document.createElement('div');
        prayerItem.classList.add('prayer-item');

        const list = document.createElement('ul');
        requests.forEach((r, i) => {
          const listItem = document.createElement('li');
          const textSpan = document.createElement('span');
          textSpan.textContent = r;
          listItem.appendChild(textSpan);

          if (localStorage.getItem(`auth-${name}`)) {
            const editBtn = document.createElement('button');
            editBtn.classList.add('edit-btn');
            editBtn.textContent = 'Edit';
            editBtn.onclick = () => {
              const newText = prompt('Edit your prayer item:', r);
              if (newText !== null && newText.trim() !== '') {
                requests[i] = newText.trim();
                prayerMap.set(name, requests);
                saveToStorage();
                renderRequests();
              }
            };
            listItem.appendChild(editBtn);
          }

          list.appendChild(listItem);
        });

        prayerItem.innerHTML = `<strong>${name}</strong>:`;
        prayerItem.appendChild(list);
        requestsContainer.appendChild(prayerItem);
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorMessage.textContent = '';

      const rawName = nameInput.value.trim() || 'Anonymous';
      const name = rawName.toLowerCase();
      const formattedName = name.charAt(0).toUpperCase() + name.slice(1);
      const request = requestInput.value.trim();

      if (request === '') {
        errorMessage.textContent = 'Prayer request cannot be empty.';
        return;
      }

      if (!prayerMap.has(formattedName)) {
        prayerMap.set(formattedName, []);
      }

      prayerMap.get(formattedName).push(request);

      // Set local edit token for this user
      localStorage.setItem(`auth-${formattedName}`, 'true');

      saveToStorage();
      renderRequests();
      form.reset();
    });

    loadFromStorage();
    renderRequests();
  </script>

</body>
</html>
