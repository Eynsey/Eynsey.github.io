<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News and Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4">
        <header class="text-center my-8">
            <h1 class="text-4xl font-bold">News and Weather</h1>
        </header>
        <main class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section id="news-section" class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4">Latest News</h2>
                <div id="news" class="text-lg mb-4"></div>
                <button id="news-button" class="bg-blue-500 text-white px-4 py-2 rounded">Get Random News</button>
            </section>
            <section id="weather-section" class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4">Weather</h2>
                <div id="weather" class="text-lg mb-4">
                    <div id="location" class="font-bold text-xl mb-2"></div>
                    <div id="temperature" class="mb-2"></div>
                    <div id="description" class="mb-2"></div>
                    <img id="weather-icon" src="" alt="Weather icon" class="w-16 h-16">
                </div>
                <button id="weather-button" class="bg-blue-500 text-white px-4 py-2 rounded">Get Random Weather</button>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newsButton = document.getElementById('news-button');
            const weatherButton = document.getElementById('weather-button');
            const weatherLocations = ['London', 'New York', 'Tokyo', 'Sydney', 'Paris'];
            const newsTopics = ['technology', 'sports', 'health', 'business', 'entertainment'];
            const IPT1_GNEWS = 'YOUR_GNEWS_API_KEY';
            const IPT2_OPENMAP = 'YOUR_OPENMAP_API_KEY';


function fetchNews(topic) {
    const url = `https://gnews.io/api/v4/search?q=${topic}&lang=en&country=us&max=10&apikey=${gnewsApiKey}`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.articles && Array.isArray(data.articles)) {
                const articles = data.articles.slice(0, 3);
                const newsContainer = document.getElementById('news');
                newsContainer.innerHTML = '';
                articles.forEach(article => {
                    const articleElement = document.createElement('div');
                    articleElement.classList.add('mb-4');
                    articleElement.innerHTML = `
                        <h3 class="font-bold">${article.title}</h3>
                        <p>${article.description}</p>
                        <a href="${article.url}" target="_blank" class="text-blue-500">Read more</a>
                    `;
                    newsContainer.appendChild(articleElement);
                });
            } else {
                console.error('No articles found or articles is not an array:', data);
                const newsContainer = document.getElementById('news');
                newsContainer.innerHTML = '<p>No news articles available.</p>';
            }
        })
        .catch(error => console.error('Error fetching news:', error));
}

            function fetchWeather(city) {
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.cod === 200) {
                            const location = data.name;
                            const temperature = data.main.temp;
                            const description = data.weather[0].description;
                            const icon = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

                            document.getElementById('location').innerText = location;
                            document.getElementById('temperature').innerText = `Temperature: ${temperature}°C`;
                            document.getElementById('description').innerText = `Description: ${description}`;
                            document.getElementById('weather-icon').src = icon;
                            document.getElementById('weather-icon').alt = `Weather icon showing ${description}`;

                            // Fetch news for the same city
                            fetchNews(location);
                        } else {
                            console.error('Error fetching weather:', data);
                            document.getElementById('weather').innerHTML = '<p>Weather data not available.</p>';
                        }
                    })
                    .catch(error => console.error('Error fetching weather:', error));
            }

            newsButton.addEventListener('click', () => {
                const randomTopic = newsTopics[Math.floor(Math.random() * newsTopics.length)];
                fetchNews(randomTopic);
            });

            weatherButton.addEventListener('click', () => {
                const randomCity = weatherLocations[Math.floor(Math.random() * weatherLocations.length)];
                fetchWeather(randomCity);
            });

            // Initial fetch
            fetchWeather('London');
        });
    </script>
</body>
</html>
