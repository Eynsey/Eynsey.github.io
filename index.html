<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prayer Request Wall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
      text-align: center;
    }
    header {
      background: #4a6fa5;
      color: white;
      padding: 20px;
    }

      margin: 0;

    main {

    }
    iframe {
      border: none;
      width: 100%;
      height: 75vh;
      min-height: 430px;
    }

      background: #eee;
      padding: 10px;
      font-size: 0.9em;
      color: #555;
    }

<body>
  <header>
    <h1>Prayer Requests</h1>

  </header>

  <main>
    <iframe src="https://www.connectprayer.com/embed/4a08142c38dbe374195d41c04562d9f8"
            onload="(new window.ParentIframeHandler(this))"></iframe>
    <script src="https://www.connectprayer.com/js/parent.js"></script>
  </main>

  <footer>
    <p>Powered by Connect Prayer | Hosted on GitHub Pages</p>
  </footer>

</html>
