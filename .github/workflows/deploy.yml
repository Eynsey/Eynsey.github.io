name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Replace API keys
        run: |
          sed -i "s/YOUR_GNEWS_API_KEY/${{ secrets.IPT1_GNEWS }}/g" index.html
          sed -i "s/YOUR_OPENMAP_API_KEY/${{ secrets.IPT2_OPENMAP }}/g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ 